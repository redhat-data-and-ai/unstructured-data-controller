version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - dupl
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    loggercheck:
      require-string-key: true
      no-printf-like: true
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
    gosec:
      excludes:
        # G101 flags Secret *key names* (e.g. "VLM_PIPELINE_API_KEY"), not values.
        - G101
        # G117 flags config struct fields named APIKey/ClientSecret; these hold
        # values read from Secrets at runtime, never serialized to disk.
        - G117
        # G706 flags logging of operator-supplied env vars, not request data.
        - G706
        # G704 flags HTTP calls to endpoints that come from CRD/provider config
        # set by the cluster admin, never from an inbound request.
        - G704
    revive:
      enable-all-rules: true
      rules:
        - name: comment-spacings
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: exported
          disabled: true
        - name: add-constant
          disabled: true
        - name: package-comments
          disabled: true
        - name: struct-tag
          arguments:
            - json,inline
        - name: dot-imports
          disabled: false
          arguments:
           - allowed-packages: ["github.com/onsi/ginkgo/v2", "github.com/onsi/gomega"]
        - name: cognitive-complexity
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: max-control-nesting
          arguments:
            - 6
        - name: confusing-results
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errchkjson
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - revive
        path: test/
        text: "var-naming"
      - linters:
          - revive
        path: ^test/
        text: "unsecure-url-scheme"
      # Test fixtures read known-good paths and need no crypto-grade randomness.
      - linters:
          - gosec
        path: (_test\.go|^test/)
        text: "(G115|G304|G404)"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
