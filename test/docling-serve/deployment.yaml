kind: Deployment
apiVersion: apps/v1
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
        component: docling-serve-api
    spec:
      restartPolicy: Always
      containers:
        - name: api
          image: ghcr.io/docling-project/docling-serve-cpu:v1.18.0
          # docling-core v1.18.0 added SSRF protection that rejects presigned S3
          # URLs pointing to cluster-internal addresses (localstack). Patch the
          # check so the controller's presigned URLs are accepted in the test env.
          command: ["sh", "-c"]
          args:
            - |
              sed -i 's/if not _is_safe_url(url_str):/if False:/' \
                /opt/app-root/lib/python3.12/site-packages/docling_core/utils/file.py
              exec docling-serve run
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: 'false'
            - name: DOCLING_SERVE_NUM_WORKERS
              value: '1'
            - name: DOCLING_SERVE_ARTIFACTS_PATH
              value: ""
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          imagePullPolicy: Always
