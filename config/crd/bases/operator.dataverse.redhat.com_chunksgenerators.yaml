---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: chunksgenerators.operator.dataverse.redhat.com
spec:
  group: operator.dataverse.redhat.com
  names:
    kind: ChunksGenerator
    listKind: ChunksGeneratorList
    plural: chunksgenerators
    singular: chunksgenerator
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="ChunksGeneratorReady")].status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=="ChunksGeneratorReady")].message
      name: Message
      type: string
    - jsonPath: .status.filesProcessed
      name: Files
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ChunksGenerator is the Schema for the chunksgenerators API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChunksGeneratorSpec defines the desired state of ChunksGenerator
            properties:
              config:
                description: |-
                  The rule uses size() rather than an empty string literal: two adjacent
                  apostrophes get autocorrected into a typographic quote, which every Go tool
                  accepts inside a comment and only the API server rejects at CRD install.
                  See TestKubebuilderMarkersAreASCII.
                properties:
                  hybridChunkerConfig:
                    description: |-
                      HybridChunkerConfig configures docling's own chunker, which splits on the
                      document's structure instead of on character counts. Unlike the in process
                      strategies it is a call to docling, and each chunk it returns knows which
                      part of the document it came from.
                    properties:
                      includeRawText:
                        description: |-
                          IncludeRawText returns the body separately from the contextualised
                          text. Both are wanted: the contextualised one is embedded, so a chunk
                          is findable under its section heading, and the raw one is what gets
                          displayed. Defaults true. False leaves nothing to display.
                        type: boolean
                      maxTokens:
                        description: |-
                          MaxTokens caps the finished chunk, headings included. Set it to the
                          context window of the embedding model the chunks are destined for;
                          unset, docling falls back to the tokenizer's own limit and produces
                          chunks nothing can embed.
                        minimum: 1
                        type: integer
                      tokenizer:
                        description: |-
                          Tokenizer counts the tokens MaxTokens is measured in. Required, because
                          there is no default that works everywhere and the failure is silent.

                          A HuggingFace model name, which is docling's own default, only resolves
                          if docling can reach huggingface.co; where it cannot, the request
                          returns success with zero chunks once the download times out. Prefer a
                          path to a tokenizer inside docling's own image.
                        type: string
                      useMarkdownTables:
                        description: |-
                          UseMarkdownTables serialises a table as markdown rather than as
                          "RowLabel, ColumnName = value" triplets. Defaults true, and settable
                          because on a table-dense corpus it is a retrieval-quality tradeoff.
                        type: boolean
                    type: object
                  markdownSplitterConfig:
                    properties:
                      chunkOverlap:
                        type: integer
                      chunkSize:
                        type: integer
                      codeBlocks:
                        type: boolean
                      headingHierarchy:
                        type: boolean
                      joinTableRows:
                        type: boolean
                      referenceLinks:
                        type: boolean
                    type: object
                  recursiveCharacterSplitterConfig:
                    properties:
                      chunkOverlap:
                        type: integer
                      chunkSize:
                        type: integer
                      keepSeparator:
                        type: boolean
                      separators:
                        items:
                          type: string
                        type: array
                    type: object
                  strategy:
                    description: |-
                      Strategy selects the chunker. The empty string is accepted because the
                      generated CRD makes this field required, so a resource that wants the
                      default sets it empty and SetDefaults fills it in.
                    enum:
                    - recursiveCharacterTextSplitter
                    - markdownTextSplitter
                    - tokenTextSplitter
                    - doclingHybridChunker
                    - ""
                    type: string
                  tokenSplitterConfig:
                    properties:
                      allowedSpecial:
                        items:
                          type: string
                        type: array
                      chunkOverlap:
                        type: integer
                      chunkSize:
                        type: integer
                      disallowedSpecial:
                        items:
                          type: string
                        type: array
                      encodingName:
                        type: string
                      modelName:
                        type: string
                    type: object
                required:
                - strategy
                type: object
                x-kubernetes-validations:
                - message: hybridChunkerConfig.tokenizer is required when strategy
                    is doclingHybridChunker
                  rule: self.strategy != 'doclingHybridChunker' || (has(self.hybridChunkerConfig)
                    && has(self.hybridChunkerConfig.tokenizer) && size(self.hybridChunkerConfig.tokenizer)
                    > 0)
              dataProduct:
                description: 'Deprecated: use StageName and DependsOn instead.'
                type: string
              dependsOn:
                items:
                  description: StageDependency identifies an upstream stage by name.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              stageName:
                type: string
            type: object
          status:
            description: ChunksGeneratorStatus defines the observed state of ChunksGenerator
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              filesProcessed:
                format: int64
                type: integer
              jobs:
                description: |-
                  Jobs tracks chunking tasks that have been submitted and not yet
                  finished. Only the strategies that chunk remotely use it; the in
                  process splitters finish within one reconcile and leave it empty.
                items:
                  description: |-
                    ChunkJob tracks one chunking task that docling has accepted and not yet
                    finished, so a restart does not lose it. It carries the config that was in
                    effect at submission, because the result can arrive after the spec has
                    changed and the metadata has to describe the chunking that ran.
                  properties:
                    attempts:
                      type: integer
                    chunksGeneratorConfig:
                      description: |-
                        The rule uses size() rather than an empty string literal: two adjacent
                        apostrophes get autocorrected into a typographic quote, which every Go tool
                        accepts inside a comment and only the API server rejects at CRD install.
                        See TestKubebuilderMarkersAreASCII.
                      properties:
                        hybridChunkerConfig:
                          description: |-
                            HybridChunkerConfig configures docling's own chunker, which splits on the
                            document's structure instead of on character counts. Unlike the in process
                            strategies it is a call to docling, and each chunk it returns knows which
                            part of the document it came from.
                          properties:
                            includeRawText:
                              description: |-
                                IncludeRawText returns the body separately from the contextualised
                                text. Both are wanted: the contextualised one is embedded, so a chunk
                                is findable under its section heading, and the raw one is what gets
                                displayed. Defaults true. False leaves nothing to display.
                              type: boolean
                            maxTokens:
                              description: |-
                                MaxTokens caps the finished chunk, headings included. Set it to the
                                context window of the embedding model the chunks are destined for;
                                unset, docling falls back to the tokenizer's own limit and produces
                                chunks nothing can embed.
                              minimum: 1
                              type: integer
                            tokenizer:
                              description: |-
                                Tokenizer counts the tokens MaxTokens is measured in. Required, because
                                there is no default that works everywhere and the failure is silent.

                                A HuggingFace model name, which is docling's own default, only resolves
                                if docling can reach huggingface.co; where it cannot, the request
                                returns success with zero chunks once the download times out. Prefer a
                                path to a tokenizer inside docling's own image.
                              type: string
                            useMarkdownTables:
                              description: |-
                                UseMarkdownTables serialises a table as markdown rather than as
                                "RowLabel, ColumnName = value" triplets. Defaults true, and settable
                                because on a table-dense corpus it is a retrieval-quality tradeoff.
                              type: boolean
                          type: object
                        markdownSplitterConfig:
                          properties:
                            chunkOverlap:
                              type: integer
                            chunkSize:
                              type: integer
                            codeBlocks:
                              type: boolean
                            headingHierarchy:
                              type: boolean
                            joinTableRows:
                              type: boolean
                            referenceLinks:
                              type: boolean
                          type: object
                        recursiveCharacterSplitterConfig:
                          properties:
                            chunkOverlap:
                              type: integer
                            chunkSize:
                              type: integer
                            keepSeparator:
                              type: boolean
                            separators:
                              items:
                                type: string
                              type: array
                          type: object
                        strategy:
                          description: |-
                            Strategy selects the chunker. The empty string is accepted because the
                            generated CRD makes this field required, so a resource that wants the
                            default sets it empty and SetDefaults fills it in.
                          enum:
                          - recursiveCharacterTextSplitter
                          - markdownTextSplitter
                          - tokenTextSplitter
                          - doclingHybridChunker
                          - ""
                          type: string
                        tokenSplitterConfig:
                          properties:
                            allowedSpecial:
                              items:
                                type: string
                              type: array
                            chunkOverlap:
                              type: integer
                            chunkSize:
                              type: integer
                            disallowedSpecial:
                              items:
                                type: string
                              type: array
                            encodingName:
                              type: string
                            modelName:
                              type: string
                          type: object
                      required:
                      - strategy
                      type: object
                      x-kubernetes-validations:
                      - message: hybridChunkerConfig.tokenizer is required when strategy
                          is doclingHybridChunker
                        rule: self.strategy != 'doclingHybridChunker' || (has(self.hybridChunkerConfig)
                          && has(self.hybridChunkerConfig.tokenizer) && size(self.hybridChunkerConfig.tokenizer)
                          > 0)
                    createdOn:
                      type: string
                    fileIdentifier:
                      type: string
                    filePath:
                      type: string
                    status:
                      type: string
                    taskID:
                      type: string
                  type: object
                type: array
              lastAppliedGeneration:
                format: int64
                type: integer
              permanentlyFailingFiles:
                description: PermanentlyFailingFiles are files that will not be retried.
                items:
                  type: string
                type: array
              permanentlyFailingGeneration:
                description: |-
                  PermanentlyFailingGeneration is the spec generation those files were
                  given up on under, so editing the spec can give them another chance.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
