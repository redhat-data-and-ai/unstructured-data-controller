---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sourcecrawlers.operator.dataverse.redhat.com
spec:
  group: operator.dataverse.redhat.com
  names:
    kind: SourceCrawler
    listKind: SourceCrawlerList
    plural: sourcecrawlers
    singular: sourcecrawler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="SourceCrawlerReady")].status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=="SourceCrawlerReady")].message
      name: Message
      type: string
    - jsonPath: .status.filesProcessed
      name: Files
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SourceCrawler is the Schema for the sourcecrawlers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SourceCrawlerSpec defines the desired state of SourceCrawler.
            properties:
              dependsOn:
                items:
                  description: StageDependency identifies an upstream stage by name.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              secretRef:
                type: string
              sourceCrawlerConfig:
                description: SourceCrawlerConfig configures where to read unstructured
                  data from.
                properties:
                  gitConfig:
                    description: GitConfig configures git repositories as a data source.
                    properties:
                      pollInterval:
                        description: |-
                          PollInterval configures how often to check for new commits via ls-remote.
                          Defaults to "5m". Minimum enforced is "5m". Examples: "5m", "1h", "24h".
                        type: string
                      provider:
                        description: |-
                          Provider identifies the git hosting platform (e.g. "gitlab").
                          Determines which token key to read from the secret. If empty, no authentication is used (public repos).
                        enum:
                        - gitlab
                        - ""
                        type: string
                      repos:
                        description: Repos is the list of git repositories to crawl.
                        items:
                          description: GitRepo configures a single git repository
                            to crawl.
                          properties:
                            description:
                              description: Description is a human-readable summary
                                of what is crawled from this repository.
                              type: string
                            fileFormats:
                              description: |-
                                FileFormats restricts which file types to crawl by extension (e.g. ["md", "pdf"]).
                                Bare extensions without dots or globs. If empty, all files are crawled.
                              items:
                                type: string
                              type: array
                            name:
                              description: |-
                                Name is a short identifier for this repository, used as the storage path slug and in status/logging.
                                Must be a safe path segment: alphanumeric, hyphens, underscores, and dots (not leading).
                              pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                              type: string
                            paths:
                              description: |-
                                Paths is a list of include and exclude rules for crawling, following gitignore syntax
                                (https://git-scm.com/docs/gitignore#_pattern_format).
                                Entries without "!" prefix are includes (e.g. "docs/", "README.md").
                                Entries with "!" prefix are excludes (e.g. "!vendor/**", "!**/test/**").
                                If no includes are specified, the entire repo is crawled (excludes still apply).
                                Excludes always take precedence over includes.
                              items:
                                type: string
                              type: array
                            repo:
                              description: Repo is the git repository URL (HTTPS).
                              type: string
                            revision:
                              description: |-
                                Revision to track: a branch name, tag name, or full commit SHA.
                                Defaults to "main".
                              type: string
                          required:
                          - name
                          - repo
                          type: object
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    required:
                    - repos
                    type: object
                  googleDriveConfig:
                    description: |-
                      GDriveConfig configures Google Drive folder crawling at the pipeline level.
                      Controller-level settings (maxRetries, concurrency, LDAP) are in ControllerConfig.
                    properties:
                      folders:
                        description: FolderIDs is the list of Google Drive folder
                          IDs to crawl recursively.
                        items:
                          properties:
                            url:
                              type: string
                          required:
                          - url
                          type: object
                        minItems: 1
                        type: array
                      skipFolders:
                        description: SkipFolderNames is an optional list of folder
                          names to skip during crawling.
                        items:
                          properties:
                            pattern:
                              type: string
                          required:
                          - pattern
                          type: object
                        type: array
                    required:
                    - folders
                    type: object
                  s3Config:
                    description: S3Config configures an S3 bucket and optional prefix.
                    properties:
                      bucket:
                        type: string
                      prefix:
                        type: string
                      sqsQueueURL:
                        type: string
                    required:
                    - bucket
                    type: object
                  type:
                    type: string
                type: object
              stageName:
                type: string
            type: object
          status:
            description: SourceCrawlerStatus defines the observed state of SourceCrawler.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              filesProcessed:
                format: int64
                type: integer
              gdriveStatus:
                items:
                  properties:
                    error:
                      type: string
                    url:
                      type: string
                  required:
                  - url
                  type: object
                type: array
              gitRepoStatus:
                items:
                  description: GitRepoStatus tracks the observed state of a single
                    git repository.
                  properties:
                    commitSHA:
                      type: string
                    configHash:
                      type: string
                    error:
                      type: string
                    repo:
                      type: string
                  required:
                  - repo
                  type: object
                type: array
              lastAppliedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
