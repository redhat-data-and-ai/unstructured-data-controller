apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: unstructured-data-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: unstructured-data-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: unstructured-data-controller
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - args:
        - /manager
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --watch-namespace=$(WATCH_NAMESPACE)
        image: controller:latest
        name: manager
        env:
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # [OTEL] Uncomment to enable OTLP push for metrics and traces.
        # When set, the controller pushes telemetry to the OTel Collector via gRPC.
        # Without this, only Prometheus scraping on /metrics is available.
        # - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #   value: "http://otel-collector.observability.svc:4317"
        # - name: OTEL_EXPORTER_OTLP_INSECURE
        #   value: "true"
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: unstructured-datastore-cache-storage
          mountPath: /data/storage
        # Mount custom CA certs to be appended to the system bundle on startup.
        # Create a ConfigMap named custom-ca-certs with PEM files to trust
        # additional certificate authorities (e.g., internal corporate CAs).
        - name: custom-ca-certs
          mountPath: /etc/pki/ca-trust/source/anchors
          readOnly: true
      volumes:
      - name: unstructured-datastore-cache-storage
        persistentVolumeClaim:
          claimName: datastore-cache
      - name: custom-ca-certs
        configMap:
          name: custom-ca-certs
          optional: true
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
