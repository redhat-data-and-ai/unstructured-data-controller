apiVersion: operator.dataverse.redhat.com/v1alpha1
kind: ControllerConfig
metadata:
  labels:
    app.kubernetes.io/name: unstructured-data-controller
    app.kubernetes.io/managed-by: kustomize
  name: controllerconfig
spec:
  secretRef: operator-secret
  doclingServeURL: "http://docling-serve:5001"
  dataStorageBucket: "data-storage-bucket"
  cacheDirectory: "tmp/cache/"
  maxConcurrentDoclingTasks: 5
  maxConcurrentLangchainTasks: 10
  # Optional: LDAP configuration for user/group identity resolution
  # ldapConfig:
  #   server: "ldap://ldap.example.com:389"
  #   groupDN: "ou=Groups,dc=example,dc=com"
  #   userDN: "uid=%s,ou=People,dc=example,dc=com"
  #   baseUserDN: "ou=People,dc=example,dc=com"
  #   userSearchFilter: "(objectClass=person)"
  #   emailAttribute: "mail"
  #   attributes: ["uid", "mail"]
  #   bindUserName: "foobar"
  # Optional: Google Drive controller-level settings (required when using googleDrive source type)
  # googleDriveConfig:
  #   maxRetries: 3
  #   concurrentFolders: 5
  #   concurrentDownloads: 10
