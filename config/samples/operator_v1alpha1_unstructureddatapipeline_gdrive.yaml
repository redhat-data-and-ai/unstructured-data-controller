apiVersion: operator.dataverse.redhat.com/v1alpha1
kind: UnstructuredDataPipeline
metadata:
  name: gdrive-pipeline
spec:
  secretRef: pipeline-secret
  description: "Pipeline for crawling Google Drive folders"
  guidance: "This pipeline indexes shared Google Drive folders. Ask the user which folder they want to search before querying."
  stages:
    - name: crawl
      type: SourceCrawler
      sourceCrawlerConfig:
        type: googleDrive
        googleDriveConfig:
          folders:
            - url: "1ua4tWAwVVZV_0p93asX5KJt7ycKH03ta"
          skipFolders:
            - pattern: "_indexes"
            - pattern: "_synthesized"
    - name: convert
      type: DocumentProcessor
      dependsOn:
        - name: crawl
      documentProcessorConfig:
        type: docling
        doclingConfig:
          from_formats: [docx, pptx, html, image, pdf, asciidoc, md, csv, xlsx]
          to_formats: [md]
          do_ocr: true
          image_export_mode: placeholder
          include_images: true
          ocr_preset: auto
          do_picture_description: true
          do_picture_classification: true
          pipeline: standard
          table_mode: accurate
          picture_description_api:
            url: "https://xyz/v1beta/openai/chat/completions"
            params:
              model: "gemini-2.5-pro"
              max_tokens: 4096
            prompt: >-
              Extract all visible content from this image: text
              (exact wording, spelling, numbers, dates, percentages),
              table data (preserve rows, columns, headers, values),
              chart/graph data (axis labels, data points, legends, trends),
              diagrams (labels, connections, flow direction),
              and any logos or watermarks.
              Reproduce numbers and figures exactly as shown.
            timeout: "60.0"
            concurrency: 5
    - name: chunk
      type: ChunksGenerator
      dependsOn:
        - name: convert
      chunksGeneratorConfig:
        strategy: recursiveCharacterTextSplitter
        recursiveCharacterSplitterConfig:
          chunkSize: 1000
          chunkOverlap: 200
    - name: embed
      type: VectorEmbeddingsGenerator
      dependsOn:
        - name: chunk
      vectorEmbeddingsGeneratorConfig:
        modelName: nomic-ai/nomic-embed-text-v1.5
    - name: sync
      type: DestinationSyncer
      dependsOn:
        - name: crawl
        - name: convert
        - name: chunk
        - name: embed
      destinationSyncerConfig:
        type: s3
        s3DestinationConfig:
          bucket: dataverse-internal-unstructured
          prefix: gdrive/
