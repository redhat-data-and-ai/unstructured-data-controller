# Operator-level secret for filestore S3, docling, and embedding model credentials
apiVersion: v1
kind: Secret
metadata:
  name: operator-secret
type: Opaque
stringData:
  DOCLING_USER_KEY: ""
  FILE_STORE_AWS_REGION: us-east-1
  FILE_STORE_AWS_ACCESS_KEY_ID: test
  FILE_STORE_AWS_SECRET_ACCESS_KEY: test
  FILE_STORE_AWS_ENDPOINT: http://localhost:4566
  NOMIC_API_KEY: ""
  NOMIC_ENDPOINT: "http://localhost:11434/v1/embeddings"
  GEMINI_API_KEY: ""
  GEMINI_ENDPOINT: "http://localhost:11434/v1/embeddings"
  VLM_API_KEY: ""
  GROUPS_READER_GOOGLE_SERVICE_ACCOUNT_JSON: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n",
      "client_email": "sa@your-project.iam.gserviceaccount.com",
      "client_id": "123456789",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
---
# Pipeline-level secret for source and destination credentials
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secret
type: Opaque
stringData:
  # Source S3 credentials
  SOURCE_S3_REGION: us-east-1
  SOURCE_S3_ACCESS_KEY_ID: test
  SOURCE_S3_SECRET_ACCESS_KEY: test
  SOURCE_S3_ENDPOINT: http://localhost:4566
  # Source Google Drive credentials
  SOURCE_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n",
      "client_email": "sa@your-project.iam.gserviceaccount.com",
      "client_id": "123456789",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
  # Destination S3 credentials
  DESTINATION_S3_REGION: us-east-1
  DESTINATION_S3_ACCESS_KEY_ID: test
  DESTINATION_S3_SECRET_ACCESS_KEY: test
  DESTINATION_S3_ENDPOINT: http://localhost:4566
