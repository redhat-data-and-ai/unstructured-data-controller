apiVersion: v1
kind: ConfigMap
metadata:
  name: unstructured-data-mcp-server-config
  labels:
    app: unstructured-data-mcp-server
data:
  # TODO: Replace YOUR_REALM with your actual Red Hat SSO realm
  SSO_AUTHORIZATION_URL: "<SSO_AUTHORIZATION_URL>"
  SSO_TOKEN_URL: "<SSO_TOKEN_URL>"
  SSO_INTROSPECTION_URL: "<SSO_INTROSPECTION_URL>"
  SSO_DISABLE_INTROSPECTION: "true"
  # TODO: Update with actual route host after deployment
  SSO_CALLBACK_URL: "<SSO_CALLBACK_URL>"
  MCP_SERVER_PORT: "8080"
  # TODO: Replace with your Snowflake account identifier (e.g., xy12345.us-east-1)
  SNOWFLAKE_ACCOUNT: "<YOUR_SNOWFLAKE_ACCOUNT>"
  # TODO: Replace with your embedding service endpoint URL
  EMBEDDING_ENDPOINT: "<YOUR_EMBEDDING_ENDPOINT>"
  # TODO: Replace with your embedding model name
  EMBEDDING_MODEL_NAME: "<YOUR_EMBEDDING_MODEL_NAME>"
  # OpenTelemetry. The deployment already consumes this ConfigMap via envFrom,
  # so uncommenting a key here is all it takes. Telemetry stays off until
  # OTEL_EXPORTER_OTLP_ENDPOINT points at a Collector.
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4317"
  # OTEL_EXPORTER_OTLP_INSECURE: "true"
  # OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=dev"
  # Unlike the controller, every tool call is traced by default. Set
  # OTEL_TRACES_SAMPLER=parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG
  # to sample down if volume ever becomes a problem.
